name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: g++
          - os: ubuntu-latest
            compiler: clang++
          - os: macos-latest
            compiler: clang++
          - os: windows-latest
            compiler: cl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - run: python -m pip install cmake ninja
      - run: cmake --preset release -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - run: cmake --build --preset release --parallel 4
      - run: ctest --preset release
  sanitizer:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - run: cmake --preset asan-ubsan -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build --preset asan-ubsan --parallel 4
      - run: ctest --preset asan-ubsan
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install cmake ninja gcovr
      - run: cmake --preset coverage -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build --preset coverage --parallel 4
      - run: ctest --preset coverage
      - run: gcovr --root . --filter 'src/' --fail-under-line 90 --json-summary coverage.json --txt coverage.txt build-coverage
      - run: gcovr --root . --filter 'src/' --exclude-throw-branches --exclude-unreachable-branches --json-summary coverage-filtered.json --txt coverage-filtered.txt build-coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage.json
            coverage.txt
            coverage-filtered.json
            coverage-filtered.txt
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck ninja-build
      - run: cmake --preset dev
      - run: python3 scripts/analyze.py --build build-dev
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev ninja-build
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz --parallel 4
      - name: Bounded fuzzing with temporary mutable corpora
        run: |
          cp -R fuzz/corpus/config "$RUNNER_TEMP/config-corpus"
          cp -R fuzz/corpus/vllm "$RUNNER_TEMP/vllm-corpus"
          mkdir -p "$RUNNER_TEMP/fuzz-artifacts"
          ./build-fuzz/fuzz_config "$RUNNER_TEMP/config-corpus" -max_total_time=10 -max_len=16384 -timeout=3 -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/"
          ./build-fuzz/fuzz_vllm "$RUNNER_TEMP/vllm-corpus" -max_total_time=10 -max_len=16384 -timeout=3 -artifact_prefix="$RUNNER_TEMP/fuzz-artifacts/"
