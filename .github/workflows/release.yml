name: Release artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    if: vars.KVBENCH_RELEASE_ENABLED == 'true'
    environment: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - run: python -m pip install cmake ninja
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel 4
      - run: ctest --preset release
      - name: Package tested binary with version check and checksum
        shell: bash
        run: |
          kvbench_binary=build-release/kvbench
          if [ "$RUNNER_OS" = Windows ]; then kvbench_binary=build-release/kvbench.exe; fi
          python scripts/package_binary.py --binary "$kvbench_binary" --platform "$RUNNER_OS" --arch "$RUNNER_ARCH" --output release-artifacts --expected-tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kvbench-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/
          if-no-files-found: error
