name: Release artifacts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    if: vars.KVBENCH_RELEASE_ENABLED == 'true'
    environment: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - run: python -m pip install cmake ninja
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel 4
      - run: ctest --preset release
      - name: Package tested binary with version check and checksum
        shell: bash
        run: |
          kvbench_binary=build-release/kvbench
          if [ "$RUNNER_OS" = Windows ]; then kvbench_binary=build-release/kvbench.exe; fi
          python scripts/package_binary.py --binary "$kvbench_binary" --platform "$RUNNER_OS" --arch "$RUNNER_ARCH" --output release-artifacts --expected-tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kvbench-${{ runner.os }}-${{ runner.arch }}
          path: release-artifacts/
          if-no-files-found: error
